<title>Cheese Rave Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@200;300;400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;400;500&display=swap">
<style>
/* Layout: one fixed 1920x1080 stage scaled to fit the screen. Lasers fan up from the DJ booth behind everything;
   slim seat count on top, 5x3 grid of glassy split-flap tiles (four pinned headline races on the outer edges),
   neon grid floor + marquee at the bottom where the band and DJ block the view.
   Color code: Oklahoma races turquoise, national races pink, called races gold. */
:root{
  --night:#040f11;
  --flapA:rgba(10,42,47,.86);   /* dark turquoise flap */
  --flapB:rgba(6,24,27,.9);     /* near-black flap */
  --teal:#3ad6d2;
  --pale:#c6f3ed;
  --pink:#ff6fb5;
  --gold:#ffd62e;               /* Cheese Rave type gold */
  --cheese:#fee700;             /* Cheese Rave wedge */
  --amber:#f1aa16;              /* wedge holes */
  --white:#effffc;
  --ink:#03181b;
  --muted:#5f8f92;
  --dem:#5f90ff; --demFill:#2f63e6;
  --rep:#ff5c5c; --repFill:#e03a41;
  --display:"Antonio","Arial Narrow","Helvetica Neue",sans-serif;
  --mono:"Martian Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--white);overflow:hidden;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#fit{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s,.4));
  background:var(--night);overflow:hidden;font-family:var(--display)}
#bg{position:absolute;inset:0;width:1920px;height:1080px}

/* ---------- top strip: seats ---------- */
#top{position:absolute;left:64px;top:22px;width:1792px;height:160px;display:grid;grid-template-columns:1fr 380px 1fr;gap:40px;align-items:end}
.chamber{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:14px}
.cside{display:grid;gap:12px;justify-items:start;padding-bottom:2px}
.cside.r{justify-items:end}
.clab{font:400 13px var(--mono);letter-spacing:.24em;color:var(--pale);white-space:nowrap}
.clab.sm{font-size:12px;color:var(--muted);letter-spacing:.2em}
/* seat charts: a dot per seat, Democrats fill in from the left, Republicans from the right, undecided in the middle */
.seats{display:block;overflow:visible}
.seats circle{transform-box:fill-box;transform-origin:center;transition:fill .6s ease}
.seats .o{fill:#2c4c52} .seats .d{fill:var(--dem)} .seats .r{fill:var(--rep)} .seats .i{fill:var(--teal)}
.seats .maj{stroke:var(--gold);stroke-linecap:round;fill:none}
.n{font-weight:300;font-size:58px;line-height:1;font-variant-numeric:tabular-nums;min-width:2.1ch;text-align:center;letter-spacing:.01em}
.nd{color:var(--dem)} .nr{color:var(--rep)}
.bar{position:relative;height:4px;display:flex;background:#123135;border-radius:2px}
.bar i{display:block;height:100%;transition:width 1s ease}
.bar .d{background:var(--dem)} .bar .r{background:var(--rep)} .bar .ind{background:var(--teal)} .bar .gap{flex:1}
.bar .maj{position:absolute;top:-8px;bottom:-8px;width:2px;margin-left:-1px;background:var(--gold)}
.mid{display:grid;justify-items:center;gap:8px;align-self:center}
#clock{font-weight:300;font-size:46px;line-height:1;color:var(--pale);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.tags{display:flex;gap:8px}
.tag{font:400 11px var(--mono);letter-spacing:.16em;padding:5px 9px;border-radius:2px;white-space:nowrap;background:rgba(4,15,17,.7)}
.tag.sample,.tag.err{color:var(--pink);box-shadow:inset 0 0 0 1px var(--pink)}
.tag.live{color:var(--teal);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--teal) 60%,transparent)}
.tag.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--teal);margin-right:8px;vertical-align:1px;animation:blink 2s ease-in-out infinite}
.tag.wait{color:var(--pale);box-shadow:inset 0 0 0 1px #1d4146}
.tag.demo{color:var(--muted);box-shadow:inset 0 0 0 1px #1d4146}
@keyframes blink{50%{opacity:.25}}
.credit{font:400 10px var(--mono);letter-spacing:.22em;color:var(--muted);white-space:nowrap}
html:fullscreen body{padding-left:0;padding-right:0}   /* full screen: the slide runs edge to edge */

/* ---------- race grid ---------- */
#grid{position:absolute;left:64px;top:196px;width:1792px;height:612px;display:grid;grid-template-columns:repeat(5,1fr);
  grid-template-rows:repeat(3,1fr);gap:24px;perspective:1800px}
.tile{position:relative;border-radius:6px;overflow:hidden;background:var(--tb);color:var(--tf);backface-visibility:hidden;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 22%,transparent);transition:box-shadow .6s}
.v-ok-a{--tb:var(--flapA);--tf:var(--pale);--acc:var(--teal)}
.v-ok-b{--tb:var(--flapB);--tf:var(--white);--acc:var(--teal)}
.v-n-a{--tb:var(--flapA);--tf:var(--pale);--acc:var(--pink)}
.v-n-b{--tb:var(--flapB);--tf:var(--white);--acc:var(--pink)}
.v-ok-c{--tb:var(--flapA);--tf:var(--pale);--acc:var(--teal)}
.v-n-c{--tb:var(--flapB);--tf:var(--white);--acc:var(--pink)}
.tile.pinned{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 50%,transparent)}
.tile.called{box-shadow:inset 0 0 0 2px var(--gold),0 0 26px rgba(255,214,46,.22)}
.tile::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(90% 70% at 0% 0%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%);opacity:.25;
  animation:breathe var(--bd,9s) ease-in-out var(--bdl,0s) infinite alternate}
.tile::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.45);pointer-events:none}
@keyframes breathe{to{opacity:1}}
.face{position:relative;height:100%;box-sizing:border-box;padding:20px 24px 18px;display:grid;grid-template-rows:auto 1fr 1fr auto;align-items:center}
.top{display:flex;align-items:center;gap:12px;min-width:0}
.lbl{flex:1;min-width:0;font:400 15px var(--mono);letter-spacing:.14em;color:var(--acc);white-space:nowrap;overflow:hidden}
.ctag,.ftag{display:none;align-items:center;gap:7px;font:500 11px var(--mono);letter-spacing:.18em;white-space:nowrap}
.ctag{color:var(--gold)}
.ctag::before{content:"";width:14px;height:11px;background:radial-gradient(circle at 62% 66%,var(--amber) 0 1.8px,transparent 2.3px),var(--cheese);
  clip-path:polygon(0 100%,100% 100%,100% 16%)}
.ftag{color:var(--pale);opacity:.7}
.called .ctag{display:inline-flex}
.final:not(.called) .ftag{display:inline-flex}
.cand{display:grid;grid-template-columns:8px minmax(0,1fr) auto;align-items:center;gap:14px;transition:opacity .5s}
.cand.trail{opacity:.42}
.pt{width:8px;height:8px;border-radius:50%}
.pt.D{background:var(--dem)} .pt.R{background:var(--rep)} .pt.I,.pt.L{background:var(--tf)} .pt.Q{box-shadow:inset 0 0 0 1.5px currentColor}
.nm{font-weight:400;font-size:34px;line-height:1.1;letter-spacing:.02em;white-space:nowrap;overflow:hidden;min-width:0}
.pc{font:300 28px var(--mono);font-variant-numeric:tabular-nums;text-align:right;min-width:4ch}
.cand.lead .pc{color:var(--acc)}
.called .cand.lead .pc{color:var(--gold)}
.called .cand.trail{opacity:.3}
.ft{display:flex;align-items:center;gap:14px}
.sbar{flex:1;height:2px;background:color-mix(in srgb,var(--tf) 14%,transparent);display:flex}
.sbar i{display:block;height:100%;background:var(--acc);transition:width .8s ease}
.called .sbar i{background:var(--gold)}
.in{font:400 11px var(--mono);letter-spacing:.14em;color:var(--muted);white-space:nowrap}
#stage.beat .tile{animation:beat .4839s ease-out infinite}
@keyframes beat{0%{filter:brightness(1.3)}100%{filter:brightness(1)}}

/* ---------- Congress takeover ---------- */
#board{position:absolute;left:64px;top:196px;width:1792px;height:612px;display:grid;grid-template-columns:1fr 1fr;gap:24px;perspective:1800px}
.brow{position:relative;background:var(--flapB);border-radius:6px;box-shadow:inset 0 0 0 1px #12363b;
  display:grid;grid-template-rows:auto 1fr auto;justify-items:center;gap:10px;padding:24px 40px 22px;overflow:hidden}
.bh{display:grid;justify-items:center;gap:6px;font:400 15px var(--mono);letter-spacing:.22em;text-align:center}
.bh b{font-weight:400;color:var(--pale)} .bh span{color:var(--muted)}
.bmain{position:relative;align-self:end}
.bmain b{position:absolute;bottom:-4px;font-weight:200;font-size:96px;line-height:.9;font-variant-numeric:tabular-nums}
.bmain .nd{right:50%;margin-right:20px;text-align:right} .bmain .nr{left:50%;margin-left:20px;text-align:left}
.bd{font:400 14px var(--mono);letter-spacing:.18em;color:var(--pale);text-align:center}

/* ---------- race call ---------- */
.call{position:absolute;left:480px;top:282px;width:960px;height:440px;border-radius:8px;transform-origin:0 0;
  background:var(--cc);color:#fff;display:grid;align-content:center;justify-items:center;text-align:center;z-index:5;
  box-shadow:0 0 140px color-mix(in srgb,var(--cc) 50%,transparent);border-top:3px solid var(--gold)}
.call.D{--cc:var(--demFill)} .call.R{--cc:var(--repFill)}
.call.I,.call.L{--cc:var(--teal);color:var(--ink)} .call.Y{--cc:var(--white);color:var(--ink)} .call.N{--cc:var(--pink);color:var(--ink)}
.call .ci{display:grid;justify-items:center;gap:14px;width:860px;opacity:0}
.ck{font:400 14px var(--mono);letter-spacing:.34em;color:var(--gold)}
.call.Y .ck,.call.N .ck,.call.I .ck,.call.L .ck{color:inherit;opacity:.8}
.cr{font-weight:300;font-size:52px;line-height:1;letter-spacing:.03em;white-space:nowrap}
.cw{font-weight:400;font-size:124px;line-height:.95;letter-spacing:.01em;white-space:nowrap;overflow:hidden;max-width:860px}
.cm{font:300 22px var(--mono);letter-spacing:.14em}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:4}

/* ---------- bottom band (expect it to be blocked) ---------- */
#band{position:absolute;left:64px;right:64px;top:848px;height:232px;overflow:hidden}
.mt{position:absolute;top:26px;white-space:nowrap;font:400 14px var(--mono);letter-spacing:.42em;color:var(--pale);opacity:.45;
  animation:marq 120s linear infinite}
@keyframes marq{to{transform:translateX(-50%)}}

/* ---------- operator controls (hidden at rest) ---------- */
#ctl{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(16px,calc(env(safe-area-inset-right,0px) + 10px));
  left:max(16px,calc(env(safe-area-inset-left,0px) + 10px));display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
#ctl.on{opacity:1;pointer-events:auto}
#ctl button{font:500 12px var(--mono);letter-spacing:.04em;color:var(--white);background:rgba(4,15,17,.9);
  border:1px solid #1f5156;border-radius:4px;padding:8px 10px;cursor:pointer}
#ctl button[aria-pressed="true"]{border-color:var(--teal);color:var(--teal)}
#ctl button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
#ctl kbd{font:inherit;opacity:.55;margin-left:4px}
/* ---------- the show's home screen: sky, airplanes/ISS, skyline, moon, then Top 10 and title slides on top ---------- */
#sky{position:absolute;inset:0;z-index:9;opacity:0;pointer-events:none;transition:opacity 1.6s ease;overflow:hidden}
#stage.show-mode #sky{opacity:1}
#sky .ly{position:absolute;display:block}
#lySky{left:0;top:0;width:1920px;height:1080px}
#skyfx{position:absolute;left:0;top:0;width:1920px;height:1080px}
#lyCity{left:0;top:379px;width:1920px;height:701px}
#lyMoon{left:218px;top:99px;width:378px;height:377px;animation:moonbob 14s ease-in-out infinite alternate}
@keyframes moonbob{from{transform:translateY(-5px)}to{transform:translateY(5px)}}
/* Top 10: a dark glass panel right of the moon, clear of the bottom of the screen; #10 lands at the bottom, later numbers stack above */
#t10{position:absolute;left:660px;top:118px;width:1200px;height:618px;box-sizing:border-box;padding:28px 44px 30px;border-radius:18px;
  background:rgba(3,8,20,.66);backdrop-filter:blur(8px);box-shadow:0 30px 90px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,214,46,.22);
  display:grid;grid-template-rows:auto 1fr;gap:16px;opacity:0;transform:translateY(18px) scale(.985);transition:opacity .6s ease,transform .6s ease}
#t10.on{opacity:1;transform:none}
.t10h{display:flex;align-items:baseline;gap:20px;border-bottom:2px solid rgba(255,214,46,.35);padding-bottom:12px;min-width:0}
.t10h b{font:900 62px/1 var(--display);color:var(--gold);letter-spacing:.01em;white-space:nowrap}
.t10h span{font:600 19px var(--mono);letter-spacing:.16em;color:var(--pale);white-space:nowrap;overflow:hidden;min-width:0}
#t10rows{display:flex;flex-direction:column-reverse;justify-content:flex-start;gap:10px;min-height:0;overflow:hidden}
.t10r{display:grid;grid-template-columns:100px minmax(0,1fr);align-items:center;gap:22px;min-height:78px}
.t10r .no{font:900 78px/.9 var(--display);color:var(--gold);text-align:right;text-shadow:0 0 24px rgba(255,214,46,.35)}
.t10r .tx{font:800 40px/1.08 var(--display);color:var(--white);letter-spacing:.01em;overflow:hidden;max-height:2.2em}
/* title slides: a big entrance, then the title settles into a small tag in the top right while the segment runs */
#ttl{position:absolute;left:640px;top:104px;width:1220px;box-sizing:border-box;padding:26px 30px;text-align:center;border-radius:16px;
  transform-origin:100% 0;transition:transform 1.1s cubic-bezier(.6,0,.2,1),background-color 1.1s ease,box-shadow 1.1s ease}
#ttl::before{content:"";position:absolute;inset:-120px -60px;z-index:-1;pointer-events:none;transition:opacity 1s;
  background:radial-gradient(closest-side,rgba(2,6,16,.72),rgba(2,6,16,0))}
#ttl.tag{transform:translate(0,-44px) scale(.42);background-color:rgba(3,8,20,.72);box-shadow:inset 0 0 0 2px rgba(255,214,46,.35)}
#ttl.tag::before{opacity:0}
#ttl .kick{font:600 22px var(--mono);letter-spacing:.32em;color:var(--gold);margin-bottom:10px}
#ttl .big{font:900 150px/1 var(--display);color:var(--white);letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;
  text-shadow:0 6px 40px rgba(0,0,0,.6);position:relative}
#ttl .big span{display:inline-block;transform-origin:50% 80%}
#ttl .rule{height:5px;margin:18px auto 0;width:62%;background:linear-gradient(90deg,transparent,var(--gold) 18%,var(--gold) 82%,transparent);transform-origin:0 50%}
#ttl .streak{position:absolute;left:0;top:50%;width:260px;height:4px;margin-top:-2px;border-radius:2px;opacity:0;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,246,200,.95));box-shadow:0 0 18px 4px rgba(255,230,150,.55)}
#ttl .shine{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);mix-blend-mode:overlay}
/* sponsor slides: logos on white cards over a dimmed screen. They sit above both the home screen and the board,
   and keep clear of the bottom of the screen, where the band and DJ stand during the rave. */
#spon{position:absolute;inset:0;z-index:15;pointer-events:none;opacity:0;transition:opacity .6s ease}
#spon.on{opacity:1}
#spon::before{content:"";position:absolute;inset:0;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  background:radial-gradient(ellipse 85% 75% at 50% 42%,rgba(5,12,28,.78),rgba(2,5,14,.94))}
#sponHead{position:absolute;left:0;right:0;top:64px;text-align:center}
#sponKick{font:600 22px var(--mono);letter-spacing:.32em;color:var(--gold)}
#sponTitle{width:1700px;margin:14px auto 0;font:900 88px/1 var(--display);color:var(--white);text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;
  text-shadow:0 6px 40px rgba(0,0,0,.6)}
#sponTitle span{display:inline-block;transform-origin:50% 80%}
#sponRule{height:5px;width:960px;margin:22px auto 0;background:linear-gradient(90deg,transparent,var(--gold) 18%,var(--gold) 82%,transparent)}
#sponGrid{position:absolute;left:110px;width:1700px;top:300px;height:560px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;
  gap:var(--g);perspective:1400px}
.scard{position:relative;width:var(--cw);height:var(--ch);background:#fff;border-radius:16px;display:grid;place-items:center;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.55)}
.scard::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--gold)}
.scard img{display:block}
.scard .gl{position:absolute;inset:0;pointer-events:none;transform:translateX(-120%);
  background:linear-gradient(105deg,transparent 40%,rgba(255,226,120,.28) 50%,transparent 60%)}
body.show-mode #ctl .rv,body:not(.show-mode) #ctl .sh{display:none}
@media (prefers-reduced-motion:reduce){.tile::before,.mt,.tag.live::before,#lyMoon{animation:none}}
/*__STYLE__*/
</style>

<div id="fit">
  <div id="stage">
    <canvas id="bg" width="1920" height="1080" aria-hidden="true"></canvas>
    <header id="top">
      <div class="chamber" aria-label="Senate seats">
        <div class="cside"><span class="clab">U.S. SENATE</span><b class="n nd" id="sD">43</b></div>
        <svg class="seats" id="sSeats" aria-hidden="true"></svg>
        <div class="cside r"><span class="clab sm">CHAMBER CONTROL</span><b class="n nr" id="sR">42</b></div>
      </div>
      <div class="mid">
        <div id="clock">9:00</div>
        <div class="tags"><span class="tag wait" id="status">CONNECTING TO RESULTS</span><span class="tag demo" id="demoChip" hidden>DEMO SPEED</span><span class="tag err" id="testChip" hidden>TEST DATA</span></div>
        <div class="credit">RESULTS: CIVICAPI.ORG</div>
      </div>
      <div class="chamber" aria-label="House seats">
        <div class="cside"><span class="clab">U.S. HOUSE</span><b class="n nd" id="hD">184</b></div>
        <svg class="seats" id="hSeats" aria-hidden="true"></svg>
        <div class="cside r"><span class="clab sm">CHAMBER CONTROL</span><b class="n nr" id="hR">165</b></div>
      </div>
    </header>

    <main id="grid" aria-label="Race results"></main>

    <section id="board" hidden aria-label="Balance of power">
      <div class="brow">
        <div class="bh"><b>U.S. SENATE</b><span>DEMOCRATS NEED 51 · REPUBLICANS NEED 50 + VP</span></div>
        <div class="bmain"><svg class="seats" id="bSSeats" aria-hidden="true"></svg><b class="nd" id="bSD">43</b><b class="nr" id="bSR">42</b></div>
        <div class="bd" id="bSDet"></div>
      </div>
      <div class="brow">
        <div class="bh"><b>U.S. HOUSE</b><span>218 SEATS FOR A MAJORITY</span></div>
        <div class="bmain"><svg class="seats" id="bHSeats" aria-hidden="true"></svg><b class="nd" id="bHD">184</b><b class="nr" id="bHR">165</b></div>
        <div class="bd" id="bHDet"></div>
      </div>
    </section>

    <div id="flash"></div>
    <div id="band" aria-hidden="true"><div class="mt" id="marq"></div></div>
    <div id="sky" aria-label="Home screen">
      <img class="ly" id="lySky" alt="" src="/*__SKYBG__*/">
      <canvas id="skyfx" width="1920" height="1080" aria-hidden="true"></canvas>
      <img class="ly" id="lyCity" alt="" src="/*__SKYLINE__*/">
      <img class="ly" id="lyMoon" alt="The Election Night Show at Tower Theatre" src="/*__MOON__*/">
      <section id="t10" hidden aria-label="Top 10 list"><div class="t10h"><b>TOP 10</b><span id="t10title"></span></div><div id="t10rows"></div></section>
      <div id="ttl" hidden><div class="kick" id="ttlKick"></div><div class="big" id="ttlBig"></div><div class="rule" id="ttlRule"></div><div class="streak" id="ttlStreak"></div><div class="shine" id="ttlShine"></div></div>
    </div>
    <section id="spon" hidden aria-label="Our sponsors">
      <div id="sponHead"><div id="sponKick"></div><div id="sponTitle"></div><div id="sponRule"></div></div>
      <div id="sponGrid"></div>
    </section>
  </div>
</div>

<div id="ctl" role="toolbar" aria-label="Operator controls">
  <button id="bFlip" class="rv" data-a="flip">Flip a tile<kbd>F</kbd></button>
  <button id="bCall" class="rv" data-a="call">Call a race<kbd>K</kbd></button>
  <button id="bBoard" class="rv" data-a="board">Congress board<kbd>C</kbd></button>
  <button id="bDemo" data-a="demo" aria-pressed="false">Demo speed<kbd>D</kbd></button>
  <button id="bBeat" class="rv" data-a="beat" aria-pressed="false">Beat sync<kbd>B</kbd></button>
  <button id="bShow" data-a="show">Home screen<kbd>H</kbd></button>
  <span id="cueBtns" style="display:contents"></span>

// Turns civicAPI race records into board races. Pure functions: no DOM, safe to test anywhere.
const ADAPT = (() => {
  const OV = {'Keisha Lance Bottoms':'LANCE BOTTOMS','Monica De La Cruz':'DE LA CRUZ','Carlos De La Cruz':'DE LA CRUZ',
    'Kristen McDonald Rivet':'MCDONALD RIVET','Marie Gluesenkamp Perez':'GLUESENKAMP PEREZ','María Elvira Salazar':'SALAZAR'};
  const SUF = /^(Jr\.?|Sr\.?|II|III|IV)$/i;
  function sur(n){
    n = String(n || '').trim(); if (OV[n]) return OV[n];
    const t = n.split(/\s+/); if (t.length < 2) return n.toUpperCase();
    return (SUF.test(t[t.length-1]) ? t.slice(-2).join(' ') : t[t.length-1]).toUpperCase();

  const cands = x => (x.candidates || []).map(c => ({n:sur(c.name), p:party(c.party, c.name), v:+c.votes || 0,
    pct:(c.percent == null ? null : +c.percent), win:!!c.winner}));
  const SQ_SUB = {'845':'JUDICIAL PANEL', '847':'PROPERTY TAX', '844':'MFG. TAX', '846':'VOTER ID'};
  const OK_TYPES = {'Governor':['OK-GOV','OKLAHOMA GOVERNOR',4], 'Lieutenant Governor':['OK-LG','OK LT. GOVERNOR',2.5],
    'Attorney General':['OK-AG','OK ATTORNEY GENERAL',2.5], 'State Treasurer':['OK-TREAS','OK TREASURER',2],
    'State Auditor':['OK-AUD','OK AUDITOR',2], 'Superintendent':['OK-SUPT','OK SUPERINTENDENT',2.5],
    'Labor Commissioner':['OK-LABOR','OK LABOR COMMISSIONER',2], 'Insurance Commissioner':['OK-INS','OK INSURANCE COMM.',2],
    'Corporation Commissioner':['OK-CORP','OK CORPORATION COMM.',2], 'US Senate':['OK-SEN','OK U.S. SENATE',2.5]};
  // Which Oklahoma races go on the board, and what they're called there. Returns null to skip.
  function okMeta(x){
    const n = x.election_name || '', t = x.type, d = x.district || '';
    if ((x.candidates || []).length < 2 || t === 'Judicial') return null;
    if (OK_TYPES[t]) { const [id, label, w] = OK_TYPES[t]; return {id, label, w}; }

      return {id:'OK-' + pre + k, label:pre + ' ' + k, w:1}; }

    m = n.match(/Oklahoma County (.+)$/);

    }

    : x.type === 'House of Representatives' ? 'H:' + x.district : null;
  return {sur, party, cands, okMeta, natKey};
})();

function blob(x, y, r, c, a){

  const sx = 960, sy = 1130;

function beatStop(){
  if (BEAT.stream) BEAT.stream.getTracks().forEach(t => t.stop());
  if (BEAT.ctx) BEAT.ctx.close().catch(() => {});
  Object.assign(BEAT, {mode:'off', ctx:null, an:null, stream:null, bpm:0, iois:[], hist:[], env:0});
  beatUI();
}
function beatUI(){ stage.classList.toggle('beat', BEAT.mode === 'steady'); $('bBeat').setAttribute('aria-pressed', BEAT.mode !== 'off'); postState(); }
function beatLabel(){
  if (BEAT.mode === 'listen') return BEAT.ctx && BEAT.ctx.state === 'suspended' ? 'click the show window once to start'
    : 'listening' + (BEAT.bpm ? ' · ' + Math.round(BEAT.bpm) + ' BPM' : '');
  return BEAT.mode === 'steady' ? 'steady pulse (' + BEAT.err + ')' : BEAT.mode === 'starting' ? 'starting…' : 'off';
}
function pulse(k){
  BEAT.env = k; BEAT.at = BEAT.lastPulse = performance.now(); BEAT.pulses++;
  if (RM || scene !== 'rave') return;
  const flash = [{filter:`brightness(${1 + .3 * k})`}, {filter:'brightness(1)'}], o = {duration:280, easing:'ease-out'};
  grid.animate(flash, o); board.animate(flash, o); $('top').animate(flash, o); $('band').animate(flash, o);
}
function beatEnv(now){   // 0-1: how hard the lasers and floor flare right now
  if (BEAT.mode === 'steady') return Math.max(0, 1 - ((now / 483.9) % 1) * 2.4);
  return BEAT.env ? Math.max(0, BEAT.env * (1 - (now - BEAT.at) / 220)) : 0;
}
function beatTick(now){
  requestAnimationFrame(beatTick);
  const B = BEAT;
  if (B.mode !== 'listen' || !B.an || scene !== 'rave' || B.ctx.state !== 'running') return;
  B.an.getFloatFrequencyData(B.f);
  let e = 0; for (let i = B.lo; i <= B.hi; i++) e += Math.pow(10, B.f[i] / 20);
  const h = B.hist, avg = h.length ? h.reduce((a, b) => a + b, 0) / h.length : e;
  h.push(e); if (h.length > 43) h.shift();   // about the last 0.7 seconds
  const rising = e > B.prevE; B.prevE = e;
  const T = B.bpm ? 60000 / B.bpm : 0;
  if (h.length > 20 && rising && e > avg * 1.35 && e > 2e-3 && now - B.last > (T ? T * .6 : 270)){   // a kick
    const ioi = now - B.last; B.last = now; B.onsets++;
    if (ioi > 270 && ioi < 1100){ B.iois.push(ioi); if (B.iois.length > 12) B.iois.shift(); }
    if (B.iois.length >= 4){   // tempo: the average gap between kicks near the median (frames round each gap), folded into 79-182 BPM
      const s = B.iois.slice().sort((a, b) => a - b), med = s[s.length >> 1], near = s.filter(v => Math.abs(v - med) < med * .12);
      let m = near.reduce((a, b) => a + b, 0) / near.length;
      while (m < 330) m *= 2; while (m > 760) m /= 2;
      B.bpm = 60000 / m;
    }
    B.next = B.bpm ? now + 60000 / B.bpm : 0; B.misses = 0;
    if (now - B.lastPulse > (T ? T * .5 : 200)) pulse(1);   // the keep-time pulse may have just fired for this beat
  } else if (T && B.next && now > B.next + 60 && B.misses < 4){   // a kick didn't register: keep time for up to four beats
    B.misses++; B.next += T; pulse(.65);
  }
  if (B.bpm && now - B.last > 8000){ B.bpm = 0; B.iois = []; }   // the music stopped: learn the next song's tempo fresh
  if (Math.round(B.bpm) !== B.shownBpm){ B.shownBpm = Math.round(B.bpm); postState(); }
}
requestAnimationFrame(beatTick);
// browsers start audio only after a click or key press in the window: pick it up on the first one
['pointerdown', 'keydown'].forEach(t => addEventListener(t, () => { if (BEAT.ctx && BEAT.ctx.state === 'suspended') BEAT.ctx.resume().then(postState, () => {}); }));

function setScene(s){
  if (sponStep >= 0) sponOff();
  scene = s;
  stage.classList.toggle('show-mode', s === 'show'); document.body.classList.toggle('show-mode', s === 'show');
  $('bShow').setAttribute('aria-pressed', s === 'show'); $('bRave').setAttribute('aria-pressed', s === 'rave');
  if (s === 'show' && !RM) setTimeout(() => launch('plane'), rand(6, 12) * 1000);   // something crosses soon after it appears
  if (s === 'rave' && BEAT.mode === 'off' && !BEAT.userOff && navigator.permissions)
    navigator.permissions.query({name:'microphone'}).then(q => { if (q.state === 'granted' && scene === 'rave' && BEAT.mode === 'off') beatStart(); }).catch(() => {});
  if (s === 'rave'){ closeT10(); hideTitle(true); if (lastCounts) setTimeout(sweepHeader, RM ? 0 : 900); slots.forEach(sl => { if (sl.race && !sl.busy) paint(sl, false); }); pump(); }
  postState();
}

// ----- control window: a separate window for the booth's laptop screen while this one is full screen on the projector -----
let ctlWin = null;
function postState(){
  if (!ctlWin || ctlWin.closed) return;
  try { ctlWin.postMessage({cr:'state', scene, t10Step, next:t10Next(), title:ttlIdx >= 0 ? TITLES[ttlIdx].text : '', mode:MODE,
    spon:sponStep, sponNext:sponNext(), loop:sponLoop, sponN:SPONSORS.length, active:activeCue(), beat:beatLabel(), beatOn:BEAT.mode !== 'off', src:srcLabel(), srcOn:SRC === 'eh'}, '*'); } catch (e) {}
}
function srcLabel(){ return MODE !== 'live' ? 'not used in ' + MODE + ' mode' : SRC === 'civic' ? 'off: civicAPI' : forceEH ? 'on (switched by hand)' : 'on: civicAPI not answering'; }
// which run-of-show cue is on screen right now (-1: none)
function activeCue(){ return CUES.findIndex(c => c.sponsor != null ? c.sponsor === sponStep : c.title != null ? c.title === ttlIdx : !!c.top10 && t10Step >= 0); }
addEventListener('message', e => {
  const d = e.data;
  if (!d || d.cr !== 'cmd' || !ctlWin || e.source !== ctlWin || !act[d.a]) return;
  act[d.a](d.arg);
});
function openControls(){
  const w = window.open('', 'cheeseRaveControls', 'width=480,height=860');
  if (!w){ showCtl(); return; }   // pop-ups blocked: the on-screen buttons still work
  ctlWin = w;
  const cueBtns = CUES.map((c, i) => `<button id="cue${i}" data-a="cue" data-arg="${i}"${c.top10 ? ' class="t10"' : ''}><b>${i + 1}</b>${cueName(c).replace(/[<&]/g, '')}${c.top10 ? '<small id="next"></small>' : ''}</button>`).join('');
  w.document.open();
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Cheese Rave controls</title><style>
    :root{color-scheme:dark}body{margin:0;padding:18px;background:#040f11;color:#effffc;font:15px system-ui,-apple-system,sans-serif}
    h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#ffd62e;margin:0 0 4px}
    #st{font:12px ui-monospace,Menlo,monospace;color:#5f8f92;margin-bottom:14px}
    h2{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#5f8f92;margin:18px 0 8px}
    .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    button{font:600 15px system-ui,sans-serif;color:#effffc;background:#0a2a2f;border:1px solid #1f5156;border-radius:8px;padding:14px 12px;cursor:pointer;text-align:left}
    button:hover{border-color:#3ad6d2}button:focus-visible{outline:2px solid #ff6fb5;outline-offset:2px}
    button b{color:#ffd62e;margin-right:8px}.wide{grid-column:1/-1}
    .t10{background:#3a3000;border-color:#ffd62e}
    button small{display:block;font:12px ui-monospace,Menlo,monospace;color:#c6f3ed;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .on{background:#3ad6d2;color:#03181b;border-color:#3ad6d2}.on small{color:#03181b}.on b{color:#03181b}
    p{font-size:12px;color:#5f8f92;line-height:1.5}
  </style></head><body>
    <h1>Cheese Rave controls</h1><div id="st">Connecting…</div>
    <div class="g"><button id="home" class="wide" data-a="show"><b>H</b>Home screen</button></div>
    <h2>Run of show</h2><div class="g">${cueBtns}</div>
    <div class="g" style="margin-top:8px"><button id="sloop" class="wide" data-a="sponloop"><b>L</b>Sponsor loop: slides 1–3, ${SPON_SECS} seconds each</button></div>
    <h2>In the sky</h2><div class="g"><button data-a="plane"><b>P</b>Airplane</button><button data-a="iss"><b>I</b>ISS</button></div>
    <h2>Cheese Rave</h2><div class="g"><button id="rave" class="wide" data-a="rave"><b>R</b>Rave board</button>
    <button data-a="board"><b>C</b>Congress board</button><button data-a="flip"><b>F</b>Flip a tile</button>
    <button id="beatb" data-a="beat"><b>B</b>Beat sync<small id="beatl">off</small></button><button data-a="demo"><b>D</b>Demo speed</button>
    <button id="srcb" class="wide" data-a="source"><b>E</b>Backup results (ElectionHub)<small id="srcl">off</small></button></div>
    <p>Keep the show window full screen on the projector. These buttons work from here; the same keys work in the show window. Number keys follow the run of show; T and S still step the Top 10 and the sponsor slides.</p>
    <script>
      const send = (a, arg) => { if (window.opener) window.opener.postMessage({cr:'cmd', a, arg}, '*'); };
      document.addEventListener('click', e => { const b = e.target.closest('button'); if (b) send(b.dataset.a, b.dataset.arg); });
      addEventListener('keydown', e => { const k = e.key.toLowerCase(); const m = {h:'show', t:'top10', ' ':'top10', arrowright:'top10', s:'sponsors', l:'sponloop', p:'plane', i:'iss', r:'rave', c:'board', f:'flip', b:'beat', d:'demo', e:'source'}[k];
        if (m){ e.preventDefault(); send(m); } else if (/^[1-9]$/.test(k)) send('cue', +k - 1); });
      addEventListener('message', e => { const d = e.data; if (!d || d.cr !== 'state') return;
        document.getElementById('st').textContent = (d.scene === 'show' ? 'Showing: home screen' : 'Showing: rave board') + (d.title ? ' · title: ' + d.title : '') + (d.t10Step >= 0 ? ' · Top 10 open' : '')
          + (d.spon >= 0 ? ' · sponsor slide ' + (d.spon + 1) + ' of ' + d.sponN : '') + (d.loop ? ' (looping)' : '') + (d.mode !== 'live' ? ' · ' + d.mode.toUpperCase() + ' MODE' : '');
        const nx = document.getElementById('next'); if (nx) nx.textContent = 'Next: ' + d.next;
        document.querySelectorAll('[id^=cue]').forEach(b => b.classList.toggle('on', b.id === 'cue' + d.active));
        document.getElementById('sloop').classList.toggle('on', d.loop);
        document.getElementById('beatl').textContent = d.beat; document.getElementById('beatb').classList.toggle('on', d.beatOn);
        document.getElementById('srcl').textContent = d.src; document.getElementById('srcb').classList.toggle('on', d.srcOn);
        document.getElementById('home').classList.toggle('on', d.scene === 'show' && d.t10Step < 0 && !d.title && d.spon < 0);
        document.getElementById('rave').classList.toggle('on', d.scene === 'rave'); });
    <\/script></body></html>`);
  w.document.close();
  setTimeout(postState, 200);
}
// sponsor slides work over the board too; titles and the Top 10 belong to the home screen
document.getElementById('cueBtns').innerHTML = CUES.map((c, i) => `<button${c.sponsor != null ? '' : ' class="sh"'} data-a="cue" data-arg="${i}">${cueName(c).replace(/[<&]/g, '')}<kbd>${i + 1}</kbd></button>`).join('');

// ----- timers -----
let simT, boardT, callT;
function startTimers(first){
  clearInterval(simT); clearTimeout(boardT); clearTimeout(callT);
  const t = T();
  if (!LIVE){
    simT = setInterval(simTick, t.sim);
    const loopCall = d => { callT = setTimeout(() => { demoCall(); loopCall(t.callEvery); }, d); };
    loopCall(first ? t.firstCall : t.callEvery);
  }
  const loopBoard = d => { boardT = setTimeout(() => { showBoard(); loopBoard(t.every); }, d); };
  loopBoard(first ? t.first : t.every);
  slots.forEach(s => { if (!s.busy) schedule(s); });
}

// ----- clock, marquee, scaling -----
function clock(){ $('clock').textContent = new Date().toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}).replace(/\s?[AP]M/, ''); }
const MARQ = 'THE ELECTION NIGHT SHOW AND CHEESE RAVE   ·   TOWER THEATRE   ·   OKLAHOMA CITY   ·   PRESENTED BY LET’S FIX THIS   ·   RESULTS VIA {SRC}   ·   ';
$('marq').textContent = MARQ.replace('{SRC}', 'CIVICAPI.ORG').repeat(4);
function fitStage(){
  const f = $('fit'); const s = Math.min(f.clientWidth/1920, f.clientHeight/1080);
  stage.style.setProperty('--s', s);
}
addEventListener('resize', fitStage);

// ----- operator controls -----
const ctl = $('ctl'); let ctlT;
function showCtl(){ ctl.classList.add('on'); clearTimeout(ctlT); ctlT = setTimeout(() => ctl.classList.remove('on'), 4000); }
addEventListener('pointermove', showCtl); addEventListener('pointerdown', showCtl);
$('bCall').hidden = LIVE;   // live calls come from the feed
const act = {
  flip(){ const free = slots.filter(s => !s.busy && !s.pin); if (free.length) swapSlot(free[Math.random()*free.length|0]); },
  call(){ if (!LIVE) demoCall(); },
  board(){ showBoard(); },
  show(){ goHome(); },
  rave(){ setScene('rave'); },
  plane(){ launch('plane'); },
  iss(){ launch('iss'); },
  top10(){ top10(); },
  title(i){ showTitle(i); },
  sponsors(){ sponsorsNext(); },
  cue(i){ const c = CUES[+i]; if (!c) return;
    if (c.sponsor != null){ stopSponLoop(); if (sponStep !== c.sponsor) showSponsors(c.sponsor); }
    else if (c.title != null) showTitle(c.title);
    else if (c.top10) top10(); },
  sponloop(){ toggleSponLoop(); },
  ctlwin(){ openControls(); },
  source(){ if (MODE !== 'live') return; forceEH = !forceEH; pickSource(); if (!forceEH) schedulePoll(0); postState(); },
  demo(){ CFG.demo = !CFG.demo; $('bDemo').setAttribute('aria-pressed', CFG.demo); $('demoChip').hidden = !CFG.demo; startTimers(false); },
  beat(){ if (BEAT.mode === 'off'){ BEAT.userOff = false; beatStart(); } else { BEAT.userOff = true; beatStop(); } },
  fs(){ const d = document.documentElement; try { (document.fullscreenElement ? document.exitFullscreen() : d.requestFullscreen()).catch(() => {}); } catch(e){} }
};
ctl.addEventListener('click', e => { const b = e.target.closest('button'); if (b && act[b.dataset.a]) act[b.dataset.a](b.dataset.arg); });
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const key = e.key.toLowerCase();
  const k = {f:'flip', k:'call', c:'board', d:'demo', b:'beat', h:'show', s:'sponsors', l:'sponloop', r:'rave', p:'plane', i:'iss', t:'top10', ' ':'top10', arrowright:'top10', w:'ctlwin', e:'source'}[key];
  if (k){ e.preventDefault(); act[k](); }
  else if (/^[1-9]$/.test(key) && CUES[+key - 1]){ e.preventDefault(); act.cue(+key - 1); }
});

// Read-only peek at a race's state, for testing and for cueing from the browser console.
window.cheeseBoard = {act: (a, arg) => act[a] && act[a](arg), seats: () => ({ours:tally(), civicapi:CIV_SEATS, listed:{S:NAT.S.size, H:NAT.H.size}}),
  source: () => ({src:SRC, forced:forceEH, failCount, ehOk:ehOk && ehOk.toISOString(), ehFails, ehApplied, credit:document.querySelector('.credit').textContent}),
  beat: () => ({mode:BEAT.mode, label:beatLabel(), bpm:Math.round(BEAT.bpm * 10) / 10, onsets:BEAT.onsets, pulses:BEAT.pulses, audio:BEAT.ctx && BEAT.ctx.state}), race: id => { const r = BY_ID[id]; return r ? {label:r.label, rep:r.rep, called:r.called, cands:r.cands.map(c => c.n + ' ' + c.v)} : null; }};

// ----- boot -----
fitStage(); clock(); setInterval(clock, 10000);
if (!LIVE) simInit();
resolvePins();
slots.forEach(s => setRace(s, s.pin || pickRace()));
// Refit names once the web fonts arrive (they're narrower than the fallbacks).
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => slots.forEach(s => { if (s.race && !s.busy){ fitSlot(s); fitLabel(s); } }));
$('bDemo').setAttribute('aria-pressed', CFG.demo); $('demoChip').hidden = !CFG.demo;
setStatus(); updateCounts(); setScene(scene);
startTimers(true);
if (LIVE) poll();   // (pollEH starts only if the backup is needed)
showCtl(); clearTimeout(ctlT); ctlT = setTimeout(() => ctl.classList.remove('on'), 7000);
})();
</script>
